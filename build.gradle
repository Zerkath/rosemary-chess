plugins {
  id 'application'
  id 'java'
  id 'jacoco'
  id 'maven-publish'
  id 'com.diffplug.spotless' version '8.11.0'
  id "me.champeau.jmh" version "0.7.3"
}

repositories {
  mavenCentral()
}

tasks.withType(JavaCompile) {
options.encoding = 'UTF-8'
  options.compilerArgs.add('-Xlint')
  // options.compilerArgs.add('-g:none')
}

test {
  jvmArgs = ['-Xms512m', '-Xmx8G']

  testLogging {
    // Show stack traces for all test events
    events 'failed'
  }

  useJUnitPlatform {
    excludeTags 'slow' // TODO: Enable the slow tests when needed
  }

  finalizedBy(tasks.jacocoTestReport)
}

dependencies {
  testImplementation(libs.junit)
  testImplementation(libs.junit.launcher)
  testImplementation(libs.junit.params)
  implementation(libs.jmh)
  implementation(libs.jmh.gen)
  implementation(libs.fastutil)
}

jacocoTestReport {
  reports {
    xml.required.set(false)
    csv.required.set(true)
  }
  dependsOn(tasks.test)
}

spotless {
  // optional: limit format enforcement to just the files changed by this feature branch
  // ratchetFrom 'origin/main'

  format 'misc', {
    // define the files to apply `misc` to
    target '*.gradle', '*.md', '.gitignore'

    // define the steps to apply to those files
    trimTrailingWhitespace()
    leadingTabsToSpaces(2) // or spaces. Takes an integer argument if you don't like 4
    endWithNewline()
  }

  java {
    // Use the default importOrder configuration
    importOrder()
    removeUnusedImports()
    // Choose one of these formatters.
    // googleJavaFormat().aosp()

    // prettier()
    // clangFormat()

    formatAnnotations()  // fixes formatting of type annotations, see below
  }
}


jar {
  manifest {
    attributes(
      "Manifest-Version": "1.0",
      "Main-Class": "rosemary.Program"
      )
  }
  from {
    configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
  }
  duplicatesStrategy = 'exclude' // Or 'warn', 'fail', etc. depending on your preference
}

application {
    mainClass = 'rosemary.Program'
}

// Used by scripts/shape.sc so Scala CLI can resolve the engine from the local Maven repository.
publishing {
  publications {
    rosemary(MavenPublication) {
      groupId = 'rosemary'
      artifactId = 'rosemary-chess'
      version = '0.0.1-SNAPSHOT'
      artifact tasks.named('jar')
    }
  }
}
